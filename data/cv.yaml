mentoring: "Since 2019 I have mentored undergraduates, graduate students, research staff, and early-career researchers at Stanford, UC Berkeley, Duke, USC, and UC Merced in fNIRS study design, data acquisition, and analysis, and served as second reader for an undergraduate thesis. As a research mentor with CMP Academy (2024 – present), I mentor high school students in neuroscience and cognitive science; mentees have since been admitted to universities including Emory, UCLA, USC, and Yale."

