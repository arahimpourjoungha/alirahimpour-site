<header class="site-header">
  <div class="wrap header-inner">
    <a class="site-name" href="{{ "/" | relURL }}">{{ site.Params.name }}</a>
    <nav class="site-nav" aria-label="Main">
      {{- $current := . }}
      {{- range site.Menus.main }}
        {{- $active := or (and $current.IsHome (eq .URL "/")) (and (ne .URL "/") (eq (printf "/%s/" $current.Section) .URL)) }}
        <a href="{{ .URL | relURL }}"{{ if $active }} aria-current="page"{{ end }}>{{ .Name }}</a>
      {{- end }}
    </nav>
  </div>
</header>
